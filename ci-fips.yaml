ssh_pwauth: true
apt:
  conf: |
    APT {
      Get {
        Assume-Yes "True";
        Fix-Broken "True";
        Auto-Remove true;
        Purge true;
      };
      Acquire {
        ForceIPv4 "True";
        http::Proxy "";
        https::Proxy "";
        ftp::Proxy "";
        # DIRECT: This is basically the apt version of no_proxy
        ;
      };
    };
  primary:
    - arches: [amd64]
      uri: http://us.archive.ubuntu.com/ubuntu
  security:
    - arches: [amd64]
      uri: http://us.archive.ubuntu.com/ubuntu
  sources_list: |
    deb [arch=amd64] $PRIMARY $RELEASE main universe restricted multiverse
    deb [arch=amd64] $PRIMARY $RELEASE-updates main universe restricted multiverse
    deb [arch=amd64] $SECURITY $RELEASE-security main universe restricted multiverse
    deb [arch=amd64] $PRIMARY $RELEASE-backports main universe restricted multiverse
snap:
  commands:
    00: ['install', 'lxd', '--channel', 'latest/stable']
package_update: true
package_upgrade: true
packages: [acl, attr, bsdmainutils, build-essential, byobu, ca-certificates, coreutils, curl, debconf-utils, devscripts, dhcpdump, dialog, dnsutils, dpkg-dev, ethtool, gawk, git, gnupg-agent, ipcalc, iperf3, jq, keyutils, kpartx, linux-image-extra-virtual-hwe-24.04-edge, linux-image-virtual-hwe-24.04-edge, locate, make, mtools, ncat, netcat-openbsd, nfs-common, nfs-kernel-server, nginx-full, nmap, nmap-common, openssh-server, openssl, ovmf, p7zip, p7zip-full, p7zip-rar, packer, pastebinit, pigz, plocate, postgresql, postgresql-client, postgresql-client-common, postgresql-common, prips, python3, python3-argcomplete, python3-pip, python3-prettytable, python3-wcwidth, python-is-python3, qemu-block-extra, qemu-system-x86, qemu-utils, sdparm, setserial, software-properties-common, sshuttle, ssl-cert, sysstat, tcpdump, uml-utilities, unzip, vim, wget, wget2, whois, wireguard, wireguard-tools, xmlstarlet, zfsutils-linux, zfs-zed]
bootcmd:
  - ['cloud-init-per', 'once', 'bc0', 'sh', '-c', 'echo "\e[0;1;38;2;255;255;255m╔════════════════════════╗\e[0m\n\e[0;1;38;2;255;255;255m║\e[0;1;38;2;255;255;255m\e[0;1;48;2;0;60;0m   Starting BOOTCMDs    \e[0;1;38;2;255;255;255m║\e[0m\n\e[0;1;38;2;255;255;255m╚════════════════════════╝\e[0m\n"']
  - ['cloud-init-per', 'once', 'bc1', 'cloud-init', 'schema', '--system']
  - ['cloud-init-per', 'once', 'bc2', 'set', '-x']
  - ['cloud-init-per', 'once', 'bc3', 'export', 'DEBIAN_FRONTEND=noninteractive']
  - ['cloud-init-per', 'once', 'bc4', 'sh', '-c', 'sed -r -i "s,//archive.ubuntu,//us.archive.ubuntu,g" /etc/apt/sources.list.d/ubuntu.sources']
  - ['cloud-init-per', 'once', 'bc5', 'sh', '-c', 'sed -r -i "/127.0.1.1/d;/127.0.0.1/a $(ip -o -4 a show dev $(ip -o route show default|grep -m1 -oP "(?<=dev )[^\s]+")|grep -m1 -oP "(?<=inet )[^/]+") cbmini.craigbender.me cbmini" /etc/hosts']
  - ['cloud-init-per', 'once', 'bc6', 'sh', '-c', 'echo "\e[0;1;38;2;255;255;255m╔════════════════════════╗\e[0m\n\e[0;1;38;2;255;255;255m║\e[0;1;38;2;255;255;255m\e[0;1;48;2;0;60;0m$(hostname -f)\e[0;1;38;2;255;255;255m║\e[0m\n\e[0;1;38;2;255;255;255m╚════════════════════════╝\e[0m\n"']
  - ['cloud-init-per', 'once', 'bc7', 'sh', '-c', 'echo ""|base64 -d|tee 1>/dev/null /etc/systemd/resolved.conf']
  - ['cloud-init-per', 'once', 'bc8', 'sh', '-c', 'rm -rf /etc/resolv.conf']
  - ['cloud-init-per', 'once', 'bc9', 'sh', '-c', 'ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf']
  - ['cloud-init-per', 'once', 'bc10', 'sh', '-c', 'systemctl restart systemd-resolved.service']
  - ['cloud-init-per', 'once', 'bc11','sh', '-c', '/usr/bin/apt-get update --option=Acquire::ForceIPv4=true']
  - ['cloud-init-per', 'once', 'bc12','sh', '-c', '/usr/bin/apt-get install --auto-remove --purge -yf --option=Acquire::ForceIPv4=true']
  - ['cloud-init-per', 'once', 'bc13', 'set', '+x']
  - ['cloud-init-per', 'once', 'bc14', 'sh', '-c', 'echo "\e[0;1;38;2;255;255;255m╔════════════════════════╗\e[0m\n\e[0;1;38;2;255;255;255m║\e[0;1;38;2;255;255;255m\e[0;1;48;2;0;60;0m   Finished BOOTCMDs    \e[0;1;38;2;255;255;255m║\e[0m\n\e[0;1;38;2;255;255;255m╚════════════════════════╝\e[0m\n"']
runcmd:
  - set +x
  - sh -c 'echo "\e[0;1;38;2;255;255;255m╔═══════════════════════╗\e[0m\n\e[0;1;38;2;255;255;255m║\e[0;1;38;2;255;255;255m\e[0;1;48;2;0;60;0m   Starting RUNCMDs    \e[0;1;38;2;255;255;255m║\e[0m\n\e[0;1;38;2;255;255;255m╚═══════════════════════╝\e[0m\n"';
  - set -x
  # Remove virsh bridge if it exists
  - if [ -n "$(command -v virsh 2>/dev/null)" ];then virsh net-destroy default;fi
  - if [ -n "$(command -v virsh 2>/dev/null)" ];then virsh net-undefine default;fi
  # Set debconf/dpkg not to prompt/ask for information during runcmds
  - export DEBIAN_FRONTEND=noninteractive
  # Ensure multicast in enabled.
  - printf "net.ipv4.icmp_echo_ignore_all=0\nnet.ipv4.icmp_echo_ignore_broadcasts=0\nnet.ipv6.icmp.echo_ignore_all=0\nnet.ipv6.icmp.echo_ignore_anycast=0\nnet.ipv6.icmp.echo_ignore_multicast=0\n"|tee 1>/dev/null /etc/sysctl.d/98-multicast.conf
  - sysctl -p /etc/sysctl.d/98-multicast.conf
  # Turn on IP forwarding for our bridges
  - printf "net.ipv4.ip_forward=1\nnet.ipv6.conf.all.forwarding=1\n"|tee 1>/dev/null /etc/sysctl.d/99-ip-forwarding.conf
  - sysctl -p /etc/sysctl.d/99-ip-forwarding.conf
  # Remove vim format option for adding a comment on every O/o
  - if [ ! -f /home/$(id -un 1000)/.vimrc ];then install -o$(id -un 1000) -g$(id -gn 1000) -m0600 /dev/null /home/$(id -un 1000)/.vimrc;fi
  - if [ -f /home/$(id -un 1000)/.vimrc ];then echo 'au BufEnter * set fo-=c fo-=r fo-=o'|tee 1>/dev/null /home/$(id -un 1000)/.vimrc;fi
  - if [ ! -f /etc/vim/vimrc.local ];then mkdir -p /etc/vim;install -o0 -g0 -m0644 /dev/null /etc/vim/vimrc.local;fi
  - if [ -f /etc/vim/vimrc.local ];then echo 'au BufEnter * set fo-=c fo-=r fo-=o' > /etc/vim/vimrc.local;fi
  # Get IP/CIDR
  - export DEFAULT_CIDR=$(ip -o -4 a show dev $(ip -o route show default|grep -m1 -oP '(?<=dev )[^\s]+')|grep -m1 -oP '(?<=inet )[^\s]+')
  - export DEFAULT_IP=${DEFAULT_CIDR%%/*}
  # Prefer IPv4 for destinations and restart networking
  - "echo 'precedence ::ffff:0:0/96  100'|tee -a /etc/gai.conf"
  # Restart networking for IPv4 stack preference takes effect
  - systemctl restart systemd-networkd
  # Source OS Release information
  - . /etc/lsb-release
  # Set vim as default EDITOR system-wide
  - echo 'EDITOR=/usr/bin/vim.basic'|tee 1>/dev/null -a /etc/environment
  # Set vim.basic as primary editor in list of alternatives
  - if [ -f /usr/bin/vim.basic ];then update-alternatives --set editor /usr/bin/vim.basic;fi
  # Set JAVA_HOME system-wide if installed
  - if [ -n "$(which 2>/dev/null java)" ];then sed -r -i "\$aJAVA_HOME=\x22$(update-alternatives --list java|awk -F/ '{gsub(/\x2fbin.*/,"");print}')\x22" /etc/environment;fi
  # Source the updated /etc/environment file
  - . /etc/environment
  # Allow non-root users to use/query fuse-based filesystems (mainly removes error when find searches a fuse filesystem)
  - if $(test -f /etc/fuse.conf);then sed -i 's/^#user_allow/user_allow/g' /etc/fuse.conf;fi
  # Configure ssh for X11 forwarding
  - sed -r -i 's/^#?(AllowAgentForwarding|AllowTcpForwarding|X11Forwarding|PermitTTY|PasswordAuthentication|PubkeyAuthentication)[^$]*/\1 yes/g;s/^#?(X11UseLocalhost)[^$]*/\1 no/;s/^#(X11DisplayOffset)[^$]*/\1 100/;s/^#?(PermitRootLogin)[^$]*/\1 no/' /etc/ssh/sshd_config
  - systemctl restart ssh
  # Create SSH Keys for default user
  - su - $(id -un 1000) -c 'if [ -d /home/$(id -un 1000)/.ssh ];then true;else mkdir -p /home/$(id -un 1000)/.ssh/;fi'
  - if [ -d /home/$(id -un 1000)/.ssh ];then chown -R $(id -un 1000):$(id -gn 1000) /home/$(id -un 1000)/.ssh;fi
  - su - $(id -un 1000) -c 'if [ -d /home/$(id -un 1000)/.ssh ];then ssh-keygen -t rsa -b 4096 -f /home/$(id -un 1000)/.ssh/id_rsa -P "";fi'
  - su - $(id -un 1000) -c 'if [ -d /home/$(id -un 1000)/.ssh ];then ssh-keygen -t ecdsa -b 521 -f /home/$(id -un 1000)/.ssh/id_ecdsa -P "";fi'
  - su - $(id -un 1000) -c 'if [ -d /home/$(id -un 1000)/.ssh ];then ssh-keygen -t dsa -b 1024 -f /home/$(id -un 1000)/.ssh/id_dsa -P "";fi'
  - su - $(id -un 1000) -c 'if [ -d /home/$(id -un 1000)/.ssh ];then ssh-keygen -t ed25519 -f /home/$(id -un 1000)/.ssh/id_ed25519 -P "";fi'
  - su - $(id -un 1000) -c 'if [ -d /home/$(id -un 1000)/.ssh ];then cat /home/$(id -un 1000)/.ssh/*.pub|tee 1>/dev/null -a /home/$(id -un 1000)/.ssh/authorized_keys;fi'
  # Disable cloud-init from setting networking back to as deployed on reboots
  - "printf 'network\x3a\x20{config\x3a\x20disabled}\n'|tee 1>/dev/null /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg"
  - systemctl restart procps.service
  # Refresh Root CA Certs, especially if we added any
  - update-ca-certificates --fresh --verbose
  - pro attach XXXXXXXXX
  - pro enable fips-updates --assume-yes
  # If we have our IP, create a correctly formated hosts entry
  - if [ -n "$(ip -o -4 a show dev $(ip -o route show default|grep -m1 -oP '(?<=dev )[^\s]+')|grep -m1 -oP '(?<=inet )[^/]+')" ];then sed -r -i "/127.0.1.1/d;/127.0.0.1/a $(ip -o -4 a show dev $(ip -o route show default|grep -m1 -oP '(?<=dev )[^\s]+')|grep -m1 -oP '(?<=inet )[^/]+') $(hostname -f) $(hostname -s)" /etc/hosts;fi
  - set +x
  - sh -c 'echo "\e[0;1;38;2;255;255;255m╔═══════════════════════════════════╗\e[0m\n\e[0;1;38;2;255;255;255m\e[0;1;38;2;255;255;255m║\e[0;1;48;2;0;60;0m    IP Address = '$DEFAULT_IP'   \e[0;1;38;2;255;255;255m║\n\e[0;1;38;2;255;255;255m╚═══════════════════════════════════╝\e[0m\n"';
  - sh -c 'echo "\e[0;1;38;2;255;255;255m╔═══════════════════════╗\e[0m\n\e[0;1;38;2;255;255;255m║\e[0;1;38;2;255;255;255m\e[0;1;48;2;0;60;0m   Finished RUNCMDs    \e[0;1;38;2;255;255;255m║\e[0m\n\e[0;1;38;2;255;255;255m╚═══════════════════════╝\e[0m\n"';

